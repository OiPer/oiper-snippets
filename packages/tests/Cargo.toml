[package]
name = "oiper-snippets-tests"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
oiper-snippets = { path = "../snippets-rs" }
serde_json = "1.0.151"

[build-dependencies]
napi-build = "2"
