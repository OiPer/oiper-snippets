name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: dtolnay/rust-toolchain@stable

      - run: corepack enable
      - run: npm install --global version-patch
      - run: pnpm install --frozen-lockfile

      - name: Set package versions
        run: |
          version-patch node "$RELEASE_TAG" --prefix v --pkg-file packages/snippets-ts/package.json --git-commit --git-msg "chore(release): v{VERSION}" --git-name "github-actions[bot]" --git-email "41898282+github-actions[bot]@users.noreply.github.com"
          version-patch cargo "$RELEASE_TAG" --prefix v --manifest-file packages/snippets-rs/Cargo.toml --skip-lock --git-commit --git-msg "chore(release): v{VERSION}" --git-name "github-actions[bot]" --git-email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check packages
        run: make ts-lint ts-typecheck rs-lint test

      - name: Build Node.js package
        run: pnpm --filter @oiper/snippets build

      - name: Publish Node.js package
        working-directory: packages/snippets-ts
        run: npm publish --access public

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

      - name: Publish Rust crate
        run: cargo publish --manifest-path packages/snippets-rs/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Push package versions
        run: |
          git pull --rebase
          git push
